name: Node.js CI

# Déclencheurs : Le pipeline se lance quand on push ou qu'on fait une Pull Request
on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    # Le serveur virtuel qui va exécuter les tests (Linux Ubuntu)
    runs-on: ubuntu-latest

    steps:
    # 1. Récupère le code du dépôt
    - name: Checkout code
      uses: actions/checkout@v4

    # 2. Installe Node.js (Version 22 comme demandé dans le TP)
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    # 3. Installe les dépendances
    # 'npm ci' est plus rapide et plus sûr que 'npm install' pour la CI
    - name: Install dependencies
      run: npm ci

    # 4. Vérifie la qualité du code (Linter)
    # Si ça échoue ici, ça s'arrête et on ne perd pas de temps à tester
    - name: Run Linter
      run: npm run lint

    # 5. Lance tous les tests (Unit, Integration, E2E)
    - name: Run Tests
      run: npm test